services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindwell
      POSTGRES_PASSWORD: mindwell
      POSTGRES_DB: mindwell
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindwell"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "127.0.0.1/test", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mindwell:mindwell@db:5432/mindwell}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://ollama:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120.0}
      VERTEX_PROJECT: ${VERTEX_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-1.5-flash-001}
      VERTEX_API_ENDPOINT: ${VERTEX_API_ENDPOINT:-}
      MONGO_ENABLED: ${MONGO_ENABLED:-false}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-mindwell}
      MONGO_MESSAGE_COLLECTION: ${MONGO_MESSAGE_COLLECTION:-companion_messages}
      MONGO_SESSION_CONTEXT_COLLECTION: ${MONGO_SESSION_CONTEXT_COLLECTION:-companion_session_contexts}
      COMPANION_OUTBOX_POLL_INTERVAL_SECONDS: ${COMPANION_OUTBOX_POLL_INTERVAL_SECONDS:-5}
      COMPANION_OUTBOX_BATCH_SIZE: ${COMPANION_OUTBOX_BATCH_SIZE:-50}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    volumes:
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    profiles:
      - llm
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "3210:8080"
    profiles:
      - llm
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "false"
      DO_NOT_TRACK: "1"
    volumes:
      - open-webui-data:/app/backend/data
      - ./openwebui/extensions:/app/backend/data/extensions/mindwell

volumes:
  postgres-data:
  ollama-data:
  mongo-data:
  open-webui-data:
